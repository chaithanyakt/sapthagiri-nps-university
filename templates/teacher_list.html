<!DOCTYPE html>
<html>
<head>
    <title>Teacher Management</title>
</head>
<body>

<a href="/dashboard/">← Back to Dashboard</a>

<h1>Teacher Management</h1>

<table border="1" width="100%">
    <tr>
        <th>Teacher ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Department</th>
    </tr>

    {% for teacher in teachers %}
    <tr>
        <td>{{ teacher.teacher_id }}</td>
        <td>{{ teacher.name }}</td>
        <td>{{ teacher.email }}</td>
        <td>{{ teacher.phone }}</td>
        <td>{{ teacher.department }}</td>
    </tr>
    {% endfor %}

</table>

</body>
</html>

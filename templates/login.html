<!DOCTYPE html>
<html>
<head>
<title>Sapthagiri NPS University Login</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    margin:0;
    height:100vh;
    overflow:hidden;
    font-family:'Segoe UI',sans-serif;
}

.container-fluid{
    height:100vh;
}

.left-side{
    height:100vh;
    background-size:cover;
    background-position:center;
    transition:1s;
}

.right-side{
    display:flex;
    justify-content:center;
    align-items:center;
    background:white;
}

.login-box{
   .login-box{
    background:white;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
}
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo h2{
    font-size:38px;
    font-weight:700;
}
}

.form-control{
    height:50px;
    border-radius:10px;
}

.btn-login{
    width:100%;
    height:50px;
    border-radius:10px;
    font-size:18px;
}

</style>
</head>

<body>

<div class="container-fluid">
<div class="row h-100">

<div class="col-md-7 left-side" id="slider"></div>

<div class="col-md-5 right-side">

<div class="login-box">

<div class="logo">
<h2>🎓 Sapthagiri NPS University</h2>
<p>ERP Login Portal</p>
</div>

<form method="POST">
{% csrf_token %}

<input type="text"
name="username"
class="form-control mb-3"
placeholder="Username">

<input type="password"
name="password"
class="form-control mb-3"
placeholder="Password">

<button class="btn btn-primary btn-login">
Login
</button>

{% if error %}
<div class="alert alert-danger mt-3">
{{ error }}
</div>
{% endif %}

</form>

</div>

</div>

</div>
</div>

<script>

const images = [

"https://images.unsplash.com/photo-1516549655169-df83a0774514?w=1200",

"https://images.unsplash.com/photo-1527613426441-4da17471b66d?w=1200",

"https://images.unsplash.com/photo-1576091160550-2173dba999ef?w=1200",

"https://images.unsplash.com/photo-1582750433449-648ed127bb54?w=1200"

];

let index=0;

function changeImage(){
document.getElementById("slider").style.backgroundImage =
`url('${images[index]}')`;

index++;
if(index>=images.length){
index=0;
}
}

changeImage();
setInterval(changeImage,5000);

</script>

</body>
</html>

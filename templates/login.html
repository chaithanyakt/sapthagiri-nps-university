{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sapthagiri NPS University Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    margin:0;
    height:100vh;
    overflow:hidden;
    font-family:'Segoe UI',sans-serif;
}

.container-fluid{
    height:100vh;
}

.left-side{
    height:100vh;
    background:url("{% static 'images/university.jpg' %}");
    background-size:cover;
    background-position:center;
}

.right-side{
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f8f9fa;
}

.login-box{
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
    width:100%;
    max-width:450px;
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo h2{
    font-size:34px;
    font-weight:700;
}

.form-control{
    height:50px;
    border-radius:10px;
}

.btn-login{
    width:100%;
    height:50px;
    border-radius:10px;
    font-size:18px;
}

</style>
</head>

<body>

<div class="container-fluid">
<div class="row h-100">

<div class="col-md-7 left-side"></div>

<div class="col-md-5 right-side">

<div class="login-box">

<div class="logo">
<h2>🎓 Sapthagiri NPS University</h2>
<p>ERP Login Portal</p>
</div>

<form method="POST">
    {% csrf_token %}

    <input
        type="text"
        name="username"
        class="form-control mb-3"
        placeholder="Username"
        required>

    <input
        type="password"
        name="password"
        class="form-control mb-3"
        placeholder="Password"
        required>

    <button
        type="submit"
        class="btn btn-primary btn-login">
        Login
    </button>

    {% if error %}
    <div class="alert alert-danger mt-3">
        {{ error }}
    </div>
    {% endif %}
</form>

</div>

</div>

</div>
</div>

</body>
</html>
